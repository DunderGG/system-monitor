name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every action is pinned by commit, with its release in a comment, so that a
# tag moved to other code cannot change what a job runs (DC-121). Update an
# action by its commit and comment together.
jobs:
  format:
    name: Format Check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-python puts its Scripts directory first on PATH, so the pinned
      # clang-format below is found before the one preinstalled on the runner.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Keep the major version in sync with $requiredClangFormatMajorVersion in
      # scripts/build.ps1; other versions can format the same code differently.
      - name: Install clang-format
        run: python -m pip install clang-format==22.1.3

      - name: Check formatting
        run: .\scripts\build.ps1 -CheckFormat

  # Builds and tests Debug, then Release, the configuration that ships
  # (DC-139), and packages Release (DC-143). Release's configure restores from
  # vcpkg's binary cache the packages that Debug's restored or built.
  #
  # Both build jobs keep vcpkg's binary cache in GitHub's cache (DC-140): they
  # restore the newest one that either saved, vcpkg reads and writes it alone,
  # and after vcpkg's last run the job prunes it to the packages installed and
  # saves it under a key of its own if vcpkg built a package or one was
  # removed. Keep the two jobs' cache steps alike: the cache's path is part of
  # its version, so a job that gave another path would not find the other's.
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Imports the x64 MSVC environment as build.ps1's own builds do, and
      # passes it to the steps below, which run cmake and ctest (DC-141).
      - name: Set up MSVC
        shell: powershell
        run: .\scripts\build.ps1 -MsvcEnvironment

      # The key never matches, so the prefix finds the newest saved cache.
      - name: Restore the vcpkg packages
        id: restore-vcpkg-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: vcpkg-x64-windows-

      # Sets VCPKG_BINARY_SOURCES, which run-vcpkg would otherwise set to its
      # x-gha provider, which vcpkg has removed.
      - name: Use the restored vcpkg packages
        id: use-vcpkg-packages
        shell: powershell
        run: .\scripts\vcpkg_cache.ps1 -Prepare -CacheDirectory "$env:RUNNER_TEMP\vcpkg-binary-cache"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # Keep vcpkgGitCommitId in sync with the "default-registry.baseline"
          # commit in vcpkg-configuration.json; a mismatch can resolve
          # different port versions locally than in CI. The coverage job pins
          # the same commit.
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e6f9e70a29a3e80a1fc510d8503304315447112f
          runVcpkgInstall: false
          # Its own cache of the vcpkg tool failed on every run, and
          # bootstrapping vcpkg takes about 15 seconds.
          doNotCache: true

      - name: Configure (Debug)
        run: cmake --preset default

      - name: Build (Debug)
        run: cmake --build --preset default

      - name: Test (Debug)
        run: ctest --preset default --output-on-failure

      - name: Configure (Release)
        run: cmake --preset release

      - name: Build (Release)
        run: cmake --build --preset release

      - name: Test (Release)
        run: ctest --preset release --output-on-failure

      # Writes the portable zip and starts its unpacked copy, so that a change
      # that breaks the package fails here rather than at a release (DC-143).
      # The script configures once more, having no stamp of the configure above.
      - name: Package (Release)
        shell: powershell
        run: .\scripts\build.ps1 -Package

      # Also after a failed step, so that the packages vcpkg built are kept.
      - name: Prune the vcpkg packages
        id: prune-vcpkg-packages
        if: ${{ !cancelled() && steps.use-vcpkg-packages.outcome == 'success' }}
        shell: powershell
        run: .\scripts\vcpkg_cache.ps1 -Prune -CacheDirectory "$env:RUNNER_TEMP\vcpkg-binary-cache"

      - name: Save the vcpkg packages
        if: ${{ !cancelled() && steps.prune-vcpkg-packages.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.restore-vcpkg-packages.outputs.cache-primary-key }}

  # Builds the coverage preset and runs the tests. On a push to main it adds the
  # run to the history on the gh-pages branch and publishes the dashboard there
  # with GitHub Pages; on a pull request it uploads the dashboard and compares
  # the run with main's last (DC-121). It fails only when the build or a test
  # does, never because of coverage (DC-122).
  coverage:
    name: Coverage
    runs-on: windows-latest
    # Only this job may write, and only its last step gets the token.
    permissions:
      contents: write
    # Runs on main take turns, so that each adds to the history that the one
    # before it published. A newer run of a pull request cancels the older one.
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Windows PowerShell 5.1, which the scripts are written for and tried with;
    # PowerShell 7 reads JSON dates and passes arguments differently.
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build and the tests run without the token in .git/config.
          persist-credentials: false

      # vcpkg builds the dependencies with MSVC here too, so the packages are
      # those of the build job, whose cache steps these follow.
      - name: Restore the vcpkg packages
        id: restore-vcpkg-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: vcpkg-x64-windows-

      - name: Use the restored vcpkg packages
        id: use-vcpkg-packages
        run: .\scripts\vcpkg_cache.ps1 -Prepare -CacheDirectory "$env:RUNNER_TEMP\vcpkg-binary-cache"

      # No Set up MSVC step: build.ps1 imports the MSVC environment itself, from
      # a Visual Studio installation that has the C++ Clang tools.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # Keep vcpkgGitCommitId in sync with the build job's, which follows
          # vcpkg-configuration.json.
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e6f9e70a29a3e80a1fc510d8503304315447112f
          runVcpkgInstall: false
          doNotCache: true

      - name: Fetch the published history
        run: .\scripts\coverage_pages.ps1 -Fetch -SiteDirectory "$env:RUNNER_TEMP\coverage-site"

      - name: Build, test and measure coverage
        run: .\scripts\build.ps1 -Coverage -CoverageHistoryPath "$env:RUNNER_TEMP\coverage-site\history.jsonl"

      - name: Prune the vcpkg packages
        id: prune-vcpkg-packages
        if: ${{ !cancelled() && steps.use-vcpkg-packages.outcome == 'success' }}
        run: .\scripts\vcpkg_cache.ps1 -Prune -CacheDirectory "$env:RUNNER_TEMP\vcpkg-binary-cache"

      - name: Save the vcpkg packages
        if: ${{ !cancelled() && steps.prune-vcpkg-packages.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.restore-vcpkg-packages.outputs.cache-primary-key }}

      - name: Summarize
        if: ${{ !cancelled() }}
        # Windows PowerShell's Out-File would start the file with a byte order mark.
        run: |
          $summaryPath = "build\coverage\summary.md"
          if (Test-Path -LiteralPath $summaryPath) {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [System.IO.File]::ReadAllText((Resolve-Path $summaryPath).Path), $utf8)
          }

      - name: Upload the dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dashboard
          path: |
            build/coverage/index.html
            build/coverage/html/
          if-no-files-found: ignore

      - name: Publish the dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\coverage_pages.ps1 -Publish -SiteDirectory "$env:RUNNER_TEMP\coverage-site"
