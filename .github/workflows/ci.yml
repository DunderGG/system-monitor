name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Keep vcpkgGitCommitId in sync with the "default-registry.baseline"
          # commit in vcpkg-configuration.json; a mismatch can resolve
          # different port versions locally than in CI.
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: e6f9e70a29a3e80a1fc510d8503304315447112f
          runVcpkgInstall: false
          doNotCache: false

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default --output-on-failure
